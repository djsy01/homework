<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apple Card Component</title>
    <link rel="icon" href="./favicon/apple-favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon/apple-favicon.svg" />
    <link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT/fonts/variable/woff2/SUIT-Variable.css" rel="stylesheet" />
    <link rel="stylesheet" href="./styles/card-component.css" />
  </head>
  <body>
    <!-- 카드 컴포넌트 -->
    <article class="card card--dark card--iphone15-pro">

      <p class="card__subtitle">티타늄. 강인함. 그 어느 때보다 가볍게.</p>
      <div class="card__links">
        <a href="#" class="card__link card__link--primary">더 알아보기</a>
        <a href="#" class="card__link card__link--secondary">구입하기</a>
      </div>
    </article>
